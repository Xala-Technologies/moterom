name: Feature request
description: Propose a change or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you want, including who it is for (customer, admin, or operators).
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Anything this request should not include.
  - type: dropdown
    id: target
    attributes:
      label: Suggested landing branch
      options:
        - dev
        - main (release / hotfix only)
      default: 0
