name: Bug report
description: Report something that is broken or incorrect
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Customer
        - Administrator
        - Unauthenticated
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local demo, staging, or production URL if known.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, or related PRs.
